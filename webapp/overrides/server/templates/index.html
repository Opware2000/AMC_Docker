<!DOCTYPE html>
<html lang="{{ request.accept_languages.best_match(['fr', 'en']) or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AMC</title>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("amc-theme")||"light";}catch(e){}</script>
    <script src="{{ static_url_for('static', filename='socket.io.js') }}"></script>
    <script src="{{ static_url_for('static', filename='amc.js') }}"></script>
    <script src="/ace/ace.js"></script>
    <link rel="stylesheet" href="{{ static_url_for('static', filename='fonts.css') }}">
    <link rel="stylesheet" href="{{ static_url_for('static', filename='amc.css') }}">
    <link rel="stylesheet" href="{{ static_url_for('static', filename='icons.css') }}">
    <script>
      /* Traductions exposées au JS (voir webapp/i18n). */
      window.AMC_I18N = {
        "webapp.btn.close": {{ _('webapp.btn.close')|tojson }},
        "webapp.btn.retry": {{ _('webapp.btn.retry')|tojson }},
        "webapp.error.load": {{ _('webapp.error.load')|tojson }},
        "webapp.error.upload_status": {{ _('webapp.error.upload_status')|tojson }},
        "webapp.upload.inprogress": {{ _('webapp.upload.inprogress')|tojson }},
        "webapp.confirm.unsaved": {{ _('webapp.confirm.unsaved')|tojson }},
        "webapp.info.nothing_to_save": {{ _('webapp.info.nothing_to_save')|tojson }},
        "webapp.step.project": {{ _('webapp.step.project')|tojson }},
        "webapp.step.scans": {{ _('webapp.step.scans')|tojson }},
        "webapp.step.marks": {{ _('webapp.step.marks')|tojson }},
        "webapp.step.export": {{ _('webapp.step.export')|tojson }},
        "webapp.fab.new_project": {{ _('webapp.fab.new_project')|tojson }},
        "webapp.fab.save": {{ _('webapp.fab.save')|tojson }},
        "webapp.fab.upload": {{ _('webapp.fab.upload')|tojson }},
        "webapp.fab.mark": {{ _('webapp.fab.mark')|tojson }},
        "webapp.toast.source_saved": {{ _('webapp.toast.source_saved')|tojson }},
        "webapp.toast.export_done": {{ _('webapp.toast.export_done')|tojson }},
        "webapp.toast.annotated": {{ _('webapp.toast.annotated')|tojson }},
        "webapp.toast.print_files": {{ _('webapp.toast.print_files')|tojson }},
        "webapp.toast.upload_cancelled": {{ _('webapp.toast.upload_cancelled')|tojson }},
        "webapp.assoc.confidence": {{ _('webapp.assoc.confidence')|tojson }},
        "webapp.assoc.detected": {{ _('webapp.assoc.detected')|tojson }}
      };
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="{{ url_for('static', filename='menu-amc.svg') }}">
</head>
<body id="app-body">

  <div id="app" version="{{ app_version }}">

    <nav id="menu">
      <div class="brand">
        <span class="branddot"></span>
        <span class="brandname">AMC</span>
      </div>
      <div id="menu-main" class="menubtn adapt-menu" onclick="tab_main();"
           title="{{ _('menu.main') }}"
           ><img src="/static/menu-amc.svg" class="menu"><span class="menulabel">{{ _('menu.main') }}</span></div>
      <div id="menu-source" class="menubtn hidden adapt-menu" onclick="tab_source();"
           title="{{ _('menu.source') }}"
           ><img src="/static/menu-source.svg" class="menu"><span class="menulabel">{{ _('menu.source') }}</span></div>
      <div id="menu-scans" class="menubtn hidden adapt-menu" onclick="tab_scans();"
           title="{{ _('menu.scans') }}"
           ><img src="/static/menu-scans.svg" class="menu"><span class="menulabel">{{ _('menu.scans') }}</span></div>
      <div id="menu-grading" class="menubtn hidden adapt-menu" onclick="tab_grading();"
           title="{{ _('menu.grading') }}"
           ><img src="/static/menu-grading.svg" class="menu"><span class="menulabel">{{ _('menu.grading') }}</span></div>
      <div id="menu-config" class="menubtn hidden adapt-menu" onclick="tab_config();"
           title="{{ _('menu.config') }}"
           ><img src="/static/menu-config.svg" class="menu"><span class="menulabel">{{ _('menu.config') }}</span></div>

      <nav id="workflow" aria-label="Progression"></nav>

      <div class="menu-foot">
        <span id="connection-status" class="offline" title="{{username}}"><i class="iconoir-cable-tag-solid"></i></span>
        <span id="menu-admin-search" class="hidden admin-action adapt-menu"
              onclick="admin_search();" title="Recherche admin"><i class="iconoir-crown"></i></span>
        <span id="menu-admin-back" class="hidden admin-action adapt-menu"
              onclick="admin_back();"><i class="iconoir-profile-circle"></i></span>
        <span id="theme-toggle" class="admin-action" onclick="toggle_theme();"
              title="{{ _('webapp.theme.toggle') }}">◐</span>
      </div>
    </nav>

    <div id="main">
      <header id="topbar">
        <div id="project-name" onclick="tab_main();"></div>
      </header>
      <div id="tab">
      </div>
    </div>

  </div>

  <button id="fab" class="fab hidden" onclick="fab_action();"
          title="" aria-label="">
    <span class="fab-icon">＋</span>
  </button>

  <div id="toasts" aria-live="polite"></div>

  <div id="info-panel" class="hidden" role="dialog" aria-modal="true" aria-live="polite">
    <div id="info-content">
      <p id="info-text">
      </p>
      <p>
        <progress id="info-prop" value="0" max="100"></progress>
      </p>
      <p class="adroite">
        <span id="info-cancel" class="btn btn-neutral hidden"
              onclick="cancel_command();">{{ _('dialog.cancel') }}</span>
      </p>
    </div>
  </div>

  <div id="warn-panel" class="hidden" role="dialog" aria-modal="true">
    <div id="warn-content">
      <div class="bandeau">
        <span class="btn btn-neutral" onclick="warn_ok();">OK</span>
      </div>
    </div>
  </div>

</body>
</html>
