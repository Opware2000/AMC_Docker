<table id="failed-scans">
  <thead>
    <tr>
      <th>Scan</th>
    </tr>
  </thead>
  <tbody>
    {% for s in scans %}
    <tr amc-scan-url="{{ s["url"] }}"
        amc-filename="{{ s["filename"] }}"
        class="scan-file failed-scan"
        onclick="failed_scan_view(this);">
      <td>{{ s["file"] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
