<div id="scans" class="scans-failed">
  <div id="failed-pages">
    <div class="distrib">
      <span class="btn btn-ok btn-grow"
            onclick="tab_scans();"
            >{{ _('failed.close') }}</span>
    </div>
    <div class="distrib">
      <span class="btn btn-neutral"
            title="{{ _('failed.preproc') }}"
            onclick="failed_pre_process();"
            >⚙️</span>
      <span class="btn btn-danger"
            title="{{ _('failed.delete') }}"
            onclick="failed_delete();"
            >❌</span>
    </div>
    <div id="failed-report">
    </div>
  </div>
  <div id="failed-images">
    <div id="failed-compare">
      <div id="failed-frames">
        <img id="failed-orig-img" class="cmp-img" src=""
             alt="{{ _('webapp.failed.original') }}"/>
        <img id="failed-pp-img" class="cmp-img cmp-pp" src=""
             alt="{{ _('webapp.failed.preprocessed') }}"/>
        <div class="cmp-handle"></div>
        <span class="cmp-tag left">{{ _('webapp.failed.original') }}</span>
        <span class="cmp-tag right">{{ _('webapp.failed.preprocessed') }}</span>
      </div>
      <input type="range" id="failed-slider" min="0" max="100" value="50"
             oninput="failed_set_split(this.value);"
             aria-label="{{ _('webapp.failed.compare') }}"/>
    </div>
  </div>
</div>
